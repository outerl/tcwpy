[project]
name = "tcwpy"
version = "0.0.1"
authors = [
    {name = "Tom Stephen", email = "tom@outerloop.io"},
    {name = "Pedro Camargo", email = "pedro@outerloop.io"},
]
description = "Read a TransCAD fixed-format binary table to a pandas DataFrame."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
]

[dependency-groups]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
